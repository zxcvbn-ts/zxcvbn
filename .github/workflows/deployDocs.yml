# This workflow builds the docs and deploys them to GitHub Pages whenever a stable core version is tagged
# For more information see: https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages

name: Deploy docs

on:
  push:
    tags:
      - '@zxcvbn-ts/core@*'
      # prereleases like 5.0.0-beta.0 keep the docs of the last stable version online
      - '!@zxcvbn-ts/core@*-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-docs:
    name: Build docs
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: yarn

      - name: Install Node.js dependencies
        run: yarn --frozen-lockfile

      - name: Build source
        run: yarn build

      - name: Build docs
        run: yarn docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vuepress/dist

  deploy-docs:
    name: Deploy docs
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
